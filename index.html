<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calc AI</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; margin: 16px; }
    button, input, textarea { font-size: 16px; width: 100%; box-sizing: border-box; margin: 6px 0; padding: 10px; border-radius: 8px; border: 0; }
    button { background: #3b82f6; color: #fff; font-weight: 700; }
    button.secondary { background: #333; }
    input, textarea { background: #222; color: #eee; }
    .log { white-space: pre-wrap; background: #1a1a1a; padding: 10px; border-radius: 8px; min-height: 140px; font-size: 14px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <h2>Calc AI</h2>
  <input id="apiKey" type="password" placeholder="API ключ Groq" />
  <input id="apiUrl" value="https://api.groq.com/openai/v1/chat/completions" />
  <input id="model" value="openai/gpt-oss-120b" />
  <textarea id="system">Отвечай кратко по-русски, до 160 символов, без markdown.</textarea>
  <button id="connectBtn">Подключить калькулятор</button>
  <button id="saveBtn" class="secondary">Сохранить настройки</button>
  <input id="q" placeholder="Вопрос с телефона" />
  <button id="sendBtn" class="secondary">Send</button>
  <div id="status">Не подключено</div>
  <div id="log" class="log"></div>
<script>
const SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
let rxChar = null;
let history = [];
const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
function log(text, cls = "") {
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = text;
  logEl.prepend(line);
}
function clip(s) {
  s = (s || "").toString().trim();
  return s.length > 160 ? s.slice(0, 160) : s;
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function pickText(data) {
  const msg = data.choices?.[0]?.message || {};
  let ans = msg.content;
  if (Array.isArray(ans)) {
    ans = ans.map(p => (typeof p === "string" ? p : (p.text || p.content || ""))).join(" ");
  }
  return clip(ans || msg.reasoning || data.choices?.[0]?.text || "");
}
["apiKey", "apiUrl", "model", "system"].forEach((id) => {
  const saved = localStorage.getItem(id);
  if (saved) document.getElementById(id).value = saved;
});
document.getElementById("saveBtn").onclick = () => {
  ["apiKey", "apiUrl", "model", "system"].forEach((id) => {
    localStorage.setItem(id, document.getElementById(id).value.trim());
  });
  log("Настройки сохранены", "ok");
};
async function sendMessages(messages, model, apiUrl, apiKey) {
  const res = await fetch(apiUrl, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + apiKey
    },
    body: JSON.stringify({ model, messages, max_tokens: 160 })
  });
  const raw = await res.text();
  if (!res.ok) throw new Error("API " + res.status + " " + raw);
  return pickText(JSON.parse(raw)) || "empty";
}
async function askAI(question) {
  const apiKey = document.getElementById("apiKey").value.trim();
  const apiUrl = document.getElementById("apiUrl").value.trim();
  const model = document.getElementById("model").value.trim().replace(/\s+/g, "");
  const system = document.getElementById("system").value.trim();
  if (!apiKey) throw new Error("Нет API ключа");
  const q = clip(question);
  const messages = [{ role: "system", content: system }, ...history, { role: "user", content: q }];
  let ans;
  try {
    ans = await sendMessages(messages, model, apiUrl, apiKey);
  } catch (e) {
    if (String(e).indexOf("413") >= 0 || String(e).indexOf("too_large") >= 0) {
      history = [];
      ans = await sendMessages([{ role: "system", content: system }, { role: "user", content: q }], model, apiUrl, apiKey);
    } else throw e;
  }
  history.push({ role: "user", content: q });
  history.push({ role: "assistant", content: ans });
  if (history.length > 8) history = history.slice(-8);
  return ans;
}
async function sendToEsp(text) {
  if (!rxChar) throw new Error("нет BLE");
  const bytes = new TextEncoder().encode(clip(text));
  await sleep(250);
  try { await rxChar.writeValueWithoutResponse(bytes); }
  catch (e) { await rxChar.writeValue(bytes); }
}
document.getElementById("connectBtn").onclick = async () => {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "CalcAI" }, { name: "Calc-ESP32" }, { namePrefix: "Calc" }],
      optionalServices: [SERVICE]
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    rxChar = await service.getCharacteristic(RX);
    statusEl.textContent = "Подключено";
    log("BLE ок", "ok");
  } catch (e) {
    statusEl.textContent = "Не подключено";
    log(String(e), "err");
  }
};
document.getElementById("sendBtn").onclick = async () => {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  log("Вопрос: " + q);
  try {
    const ans = await askAI(q);
    log("Ответ: " + ans, "ok");
    await sendToEsp(ans);
  } catch (e) {
    log(String(e), "err");
  }
};
</script>
</body>
</html>
